name: Reproduce Exoplanet G Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exoplanet-g-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Atlas
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Atlas, bundled extension, qualifier, and Jupyter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --no-deps ./extensions/ATLAS_AI_RESEARCH_EXTENSION_v0_10_0/dist/scienceatlas_ai-0.10.0-py3-none-any.whl
          python -m pip install pytest jupyter nbconvert nbformat ipykernel

      - name: Run 119-test Atlas qualifier
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: pytest -q -p no:cacheprovider

      - name: Execute exoplanet dimensional-birth notebook
        run: |
          mkdir -p /tmp/atlas-notebook
          jupyter nbconvert \
            --to notebook \
            --execute examples/exoplanets_dimensional_birth_of_G.ipynb \
            --output exoplanets_dimensional_birth_of_G.executed.ipynb \
            --output-dir /tmp/atlas-notebook \
            --ExecutePreprocessor.timeout=600

      - name: Verify Atlas result
        run: |
          python - <<'PY'
          import json
          import nbformat

          path = "/tmp/atlas-notebook/exoplanets_dimensional_birth_of_G.executed.ipynb"
          nb = nbformat.read(path, as_version=4)

          texts = []

          for cell in nb.cells:
              for output in cell.get("outputs", []):
                  if output.get("output_type") == "stream":
                      texts.append(output.get("text", ""))
                  elif output.get("output_type") in ("execute_result", "display_data"):
                      data = output.get("data", {})
                      if "text/plain" in data:
                          texts.append(data["text/plain"])

          result = None

          for text in reversed(texts):
              text = str(text).strip()
              if '"RETROSPECTIVE_DIMENSIONAL_CLOSURE_EXAMPLE_PASS"' in text:
                  result = json.loads(text)
                  break

          if result is None:
              raise AssertionError("Final Atlas receipt was not found")

          assert result["candidate_count"] == 172, result
          assert result["frozen_exponents"] == [3, -2, -1], result
          assert result["generated_dimension_text"] == "L^3 M^-1 T^-2", result
          assert result["exact_nullity_after_axis_birth"] == 1, result
          assert result["registry_dimension_match_CONST_G"] is True, result

          print()
          print("ATLAS EXOPLANET-G REPRODUCTION: PASS")
          print("hypotheses =", result["candidate_count"])
          print("winner =", tuple(result["frozen_exponents"]))
          print("dimension =", result["generated_dimension_text"])
          print("p =", result["exact_nullity_after_axis_birth"])
          PY

      - name: Save executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exoplanet-g-executed-notebook
          path: /tmp/atlas-notebook/exoplanets_dimensional_birth_of_G.executed.ipynb
